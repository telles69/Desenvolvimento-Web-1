<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Blog do Fallen</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-page">
    <!-- Botão de Tema -->
    <button class="theme-toggle" id="themeToggle" title="Alternar tema">
      <i class="fas fa-moon"></i>
    </button>

    <div class="login-container">
      <div class="row h-100 w-100 align-items-center justify-content-center">
        <!-- Coluna do Formulário -->
        <div class="col-lg-4 col-md-6 col-sm-8 col-12">
          <div class="login-form-wrapper">
            <!-- Logo/Título -->
            <div class="text-center mb-4">
              <h1 class="display-6 fw-bold">Blog do Fallen</h1>
              <p class="text-muted">Crie sua conta</p>
            </div>

            <!-- Formulário -->
            <form class="registro-form">
              <!-- Nome de Usuário -->
              <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Nome de Usuário</label>
                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="username"
                  placeholder="seu_usuario"
                  required
                />
              </div>

              <!-- Email -->
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input
                  type="email"
                  class="form-control form-control-lg"
                  id="email"
                  placeholder="seu@email.com"
                  required
                />
              </div>

              <!-- Senha -->
              <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Senha</label>
                <input
                  type="password"
                  class="form-control form-control-lg"
                  id="password"
                  placeholder="••••••••"
                  required
                />
              </div>

              <!-- Confirmação de Senha -->
              <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-semibold">Confirmar Senha</label>
                <input
                  type="password"
                  class="form-control form-control-lg"
                  id="confirmPassword"
                  placeholder="••••••••"
                  required
                />
              </div>

              <!-- Botão de Registro -->
              <button type="submit" class="btn btn-login btn-lg w-100 mb-3">
                Criar Conta
              </button>

              <!-- Login -->
              <div class="text-center">
                <p class="text-muted small">
                  Já tem conta?
                  <a href="login.html" class="text-decoration-none fw-semibold">
                    Faça login aqui
                  </a>
                </p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script Customizado -->
    <script src="js/registro.js"></script>
  </body>
</html>
