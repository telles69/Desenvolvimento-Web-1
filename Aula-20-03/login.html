<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Blog do Fallen</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-page">
    <button class="theme-toggle" id="themeToggle" title="Alternar tema">
      <i class="fas fa-moon"></i>
    </button>

    <div class="login-container">
      <div class="row h-100 w-100 align-items-center justify-content-center">
        <div class="col-lg-4 col-md-6 col-sm-8 col-12">
          <div class="login-form-wrapper">
            <div class="text-center mb-4">
              <h1 class="display-6 fw-bold">Blog do Fallen</h1>
              <p class="text-muted">Entre na sua conta</p>
            </div>

            <form class="login-form">
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input
                  type="email"
                  class="form-control form-control-lg"
                  id="email"
                  placeholder="seu@email.com"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Senha</label>
                <input
                  type="password"
                  class="form-control form-control-lg"
                  id="password"
                  placeholder="••••••••"
                  required
                />
              </div>

              <div class="mb-4">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="remember"
                  />
                  <label class="form-check-label" for="remember">
                    Lembrar-me
                  </label>
                </div>
              </div>

              <button type="submit" class="btn btn-login btn-lg w-100 mb-3">
                Entrar
              </button>

              <div class="text-center">
                <p class="text-muted small">
                  Não tem conta?
                  <a href="registro.html" class="text-decoration-none fw-semibold">
                    Crie uma aqui
                  </a>
                </p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/login.js"></script>
  </body>
</html>
